[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'

[project]
name = 'ghost-config'
version = '0.1.0'
description = 'Find configuration keys that are defined but never used, or referenced but never defined.'
requires-python = '>=3.11'
license = {text = 'MIT'}

[project.scripts]
ghost-config = 'ghost_config.__main__:main'
